<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="dontleteuwatchyou">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0c16"/>
      <stop offset="1" stop-color="#191430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="eyeShape">
      <path d="M-120 0 Q0 -78 120 0 Q0 78 -120 0Z"/>
    </clipPath>
    <style>
      .title { font: 700 56px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #f2f3f5; letter-spacing: -1px; }
      .sub { font: 500 20px "Segoe UI", Inter, system-ui, sans-serif; fill: #b5bac1; }
      .tag { font: 600 15px ui-monospace, Consolas, monospace; fill: #c4b5fd; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .lid { animation: lid 6s ease-in-out infinite; transform-origin: 0 0; }
      .scan { animation: scan 4s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes lid { 0%, 44%, 52%, 100% { transform: scaleY(0); } 48% { transform: scaleY(1); } }
      @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(80px); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .lid, .scan { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <text x="64" y="118" class="tag">~/whoami</text>
  <text x="64" y="178" class="title">dontleteuwatchyou<tspan fill="url(#accent)" class="cursor">_</tspan></text>
  <text x="64" y="222" class="sub">Privacy lover · vibecoder assumé · obsédé par la performance</text>

  <!-- L'œil barré : on ne se laisse pas regarder. -->
  <g transform="translate(985 150)">
    <path d="M-120 0 Q0 -78 120 0 Q0 78 -120 0Z" fill="#0e0c16" stroke="url(#accent)" stroke-width="4"/>
    <g clip-path="url(#eyeShape)">
      <circle r="42" fill="#4c3fb8"/>
      <circle r="42" fill="none" stroke="#8b7cf6" stroke-width="3"/>
      <circle r="18" fill="#0e0c16"/>
      <circle cx="12" cy="-12" r="7" fill="#f2f3f5" opacity="0.85"/>
      <rect class="scan" x="-130" y="-2" width="260" height="3" fill="#c4b5fd" opacity="0.5"/>
      <rect class="lid" x="-130" y="-80" width="260" height="160" fill="#191430"/>
    </g>
    <line x1="-104" y1="70" x2="104" y2="-70" stroke="#f23f43" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
